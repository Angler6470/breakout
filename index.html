<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corner Critters: 'Breakout'</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #gameContainer {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    #gameCanvas {
      background-color: rgb(30, 30, 30);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.85);
      border: 2px solid #333;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      cursor: crosshair;
    }
    .mobile-btn {
      position: absolute;
      background: rgba(40, 45, 60, 0.75);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      font-size: 14px;
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 10;
    }
    #pauseBtn {
      top: 15px;
      right: 15px;
      width: 70px;
      height: 38px;
    }
    #missileBtn {
      bottom: 25px;
      right: 20px;
      width: 80px;
      height: 50px;
      background: rgba(220, 60, 40, 0.8);
      font-size: 13px;
      text-align: center;
    }
    @media (hover: none) and (pointer: coarse) {
      .mobile-btn {
        display: flex;
      }
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <button id="pauseBtn" class="mobile-btn">PAUSE</button>
  <button id="missileBtn" class="mobile-btn">FIRE 🚀</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const pauseBtn = document.getElementById("pauseBtn");
const missileBtn = document.getElementById("missileBtn");

// --- SYNTHESIZED SOUNDS VIA WEB AUDIO API ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBounceSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;

  osc.type = "sine";
  osc.frequency.setValueAtTime(1410, now);
  osc.frequency.exponentialRampToValueAtTime(1350, now + 0.1);

  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playPowerupSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;

  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();
  osc1.type = "triangle";
  osc1.frequency.setValueAtTime(587.33, now);
  gain1.gain.setValueAtTime(0.35, now);
  gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
  osc1.connect(gain1);
  gain1.connect(audioCtx.destination);
  osc1.start(now);
  osc1.stop(now + 0.12);

  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = "triangle";
  osc2.frequency.setValueAtTime(880, now + 0.08);
  gain2.gain.setValueAtTime(0.35, now + 0.08);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);
  osc2.start(now + 0.08);
  osc2.stop(now + 0.28);
}

// --- CRITTER ABSTRACTION MAP (Colors instead of images) ---
const critterTypes = [
  { name: "aggressive-shark.png", color: "rgb(60, 90, 110)" }, 
  { name: "armored-walrus.png", color: "rgb(160, 220, 240)" }, 
  { name: "bandit-raccoon.png", color: "rgb(80, 80, 80)" }, 
  { name: "basic-blueberry.png", color: "rgb(60, 100, 255)" }, 
  { name: "bulldog-retriever.png", color: "rgb(130, 90, 50)" }, 
  { name: "charging-gorilla.png", color: "rgb(40, 40, 40)" }, 
  { name: "heavy-pumpkin.png", color: "rgb(255, 120, 20)" }, 
  { name: "smashing-stegosaurus.png", color: "rgb(80, 200, 80)" }, 
  { name: "sneaky-t-rex.png", color: "rgb(40, 120, 40)" }, 
  { name: "stampeding-elephant.png", color: "rgb(170, 170, 180)" }, 
  { name: "tough-tomato.png", color: "rgb(240, 50, 50)" }, 
  { name: "treading-triceratops.png", color: "rgb(220, 180, 90)" } 
];

const iconFilenames = {
  walrus: 'shield.png',
  tomato: 'large_ball.png',
  shark: 'missiles_loaded.png',
  raccoon: 'inverted_controls.png',
  stego: 'shattered_paddle.png',
  trex: 'invisible_ball.png',
  triceratops: 'momentum_drift.png',
  pumpkin: 'seismic_paddle.png'
};

const iconDescriptions = {
  walrus: 'Protective barrier forms underneath the paddle',
  tomato: 'Enlarges the ball to plow through multiple blocks',
  shark: 'Loads active missiles into paddle [Press 1 to fire]',
  raccoon: 'Inverts paddle movement controls horizontally',
  stego: 'Fractures the paddle into 3 separated segments',
  trex: 'Cloaks the ball, revealing only its path trail',
  triceratops: 'Forces continuous sideways momentum drift',
  pumpkin: 'Heavy paddle triggers earthquakes that break blocks'
};

const statusIcons = {};
const iconAnimState = {};

Object.keys(iconFilenames).forEach(key => {
  iconAnimState[key] = { offset: 0, angle: 0, wasActive: false };
  const rawImg = new Image();
  rawImg.src = `icons/${iconFilenames[key]}`;
  rawImg.onload = () => {
    const tile = document.createElement("canvas");
    tile.width = 32;
    tile.height = 32;
    const tctx = tile.getContext("2d");
    tctx.imageSmoothingEnabled = false;

    tctx.fillStyle = "rgb(230, 235, 245)";
    roundRect(tctx, 0, 0, 32, 32, 4, true, false);
    tctx.strokeStyle = "rgb(160, 180, 210)";
    tctx.lineWidth = 1;
    roundRect(tctx, 0.5, 0.5, 31, 31, 4, false, true);
    tctx.drawImage(rawImg, 1, 1, 30, 30);
    statusIcons[key] = tile;
  };
});

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// --- GAME STATE & VARIABLES ---
let score = 0, lives = 3;
let gameState = "START_SCREEN";
let gameOverReason = "GAME OVER";
let gameOverY = -120;
let ballTrail = [];

let walrusTimer = 0, tomatoTimer = 0, raccoonTimer = 0;
let bulldogTimer = 0, stegoTimer = 0, trexTimer = 0;
let triceratopsTimer = 0, pumpkinTimer = 0;
let shakeTimer = 0, elephantMsgTimer = 0, harderMsgTimer = 0;
let triceratopsDrift = 0, sharkMissiles = 0;

let leftWallHitTime = 0;
let rightWallHitTime = 0;

let activeMissiles = [], dirtBlocks = [], extraBalls = [];

const blockW = 42;
const blockH = 42;
let blocks = [];

let lastDropTime = performance.now();
let lastFrameTime = performance.now();
let dropInterval = 15000;

const paddle = { x: 350, y: 550, w: 100, h: 15 };
const basePaddleSpeed = 6.5;

const BASE_BALL_SPEED = 3.6;
let ballSize = 20;
const ball = { 
  x: paddle.x + paddle.w / 2 - ballSize / 2, 
  y: paddle.y - ballSize - 5, 
  w: ballSize, 
  h: ballSize, 
  dx: BASE_BALL_SPEED, 
  dy: -BASE_BALL_SPEED, 
  angle: 0 
};

const keys = {};
let mouseX = 0, mouseY = 0;

// Unified tracking for touch/mouse position
let inputX = paddle.x;
let isInteracting = false; 

function createBallCanvas(size) {
  const bSurf = document.createElement("canvas");
  bSurf.width = size; bSurf.height = size;
  const bctx = bSurf.getContext("2d");
  const radius = size / 2;
  const lineW = Math.max(2, Math.floor(size / 6));

  bctx.fillStyle = "rgb(255, 100, 100)";
  bctx.beginPath();
  bctx.arc(radius, radius, radius, 0, Math.PI * 2);
  bctx.fill();

  bctx.strokeStyle = "rgb(255, 255, 255)";
  bctx.lineWidth = lineW;
  bctx.beginPath();
  bctx.moveTo(radius, 0); bctx.lineTo(radius, size);
  bctx.moveTo(0, radius); bctx.lineTo(size, radius);
  bctx.stroke();

  return bSurf;
}
let ballSurface = createBallCanvas(ballSize);

const genericBlock = document.createElement("canvas");
genericBlock.width = blockW; genericBlock.height = blockH;
const gctx = genericBlock.getContext("2d");
gctx.fillStyle = "rgb(100, 150, 200)";
gctx.fillRect(0, 0, blockW, blockH);
gctx.strokeStyle = "rgb(50, 100, 150)";
gctx.lineWidth = 3;
gctx.strokeRect(0, 0, blockW, blockH);

const dirtSurface = document.createElement("canvas");
dirtSurface.width = blockW; dirtSurface.height = blockH;
const dctx = dirtSurface.getContext("2d");
dctx.fillStyle = "rgb(120, 80, 40)";
dctx.fillRect(0, 0, blockW, blockH);
dctx.strokeStyle = "rgb(80, 50, 20)";
dctx.lineWidth = 3;
dctx.strokeRect(0, 0, blockW, blockH);

function getRandomCritter(row) {
  const weights = critterTypes.map(c => {
    if (c.name === "basic-blueberry.png") return row < 2 ? 70 : (row < 4 ? 20 : 10);
    return 10;
  });
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  let rand = Math.random() * totalWeight;
  for (let i = 0; i < critterTypes.length; i++) {
    if (rand < weights[i]) return critterTypes[i];
    rand -= weights[i];
  }
  return critterTypes[0];
}

function buildLevel() {
  const totalSlots = 6 * 16;
  const targetSpecials = Math.round(totalSlots * 0.19);
  
  const specialIndices = new Set();
  while (specialIndices.size < targetSpecials) {
    specialIndices.add(Math.floor(Math.random() * totalSlots));
  }

  const list = [];
  let index = 0;
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 16; col++) {
      const rect = { x: col * (blockW + 5) + 24, y: row * (blockH + 5) + 50, w: blockW, h: blockH };
      if (specialIndices.has(index)) {
        const critter = getRandomCritter(row);
        list.push({ rect, is_powerup: true, type: critter.name, color: critter.color });
      } else {
        list.push({ rect, is_powerup: false, type: 'generic' });
      }
      index++;
    }
  }
  return list;
}

blocks = buildLevel();

function startNewGame() {
  lives = 3; score = 0;
  dropInterval = 15000;
  blocks = buildLevel();
  ballSize = 20;
  ballSurface = createBallCanvas(ballSize);
  paddle.x = 350; inputX = paddle.x; isInteracting = false;
  ball.w = ballSize; ball.h = ballSize;
  ball.x = paddle.x + paddle.w / 2 - ballSize / 2;
  ball.y = paddle.y - ballSize - 5;
  ball.dx = BASE_BALL_SPEED; ball.dy = -BASE_BALL_SPEED;
  ballTrail = [];
  walrusTimer = 0; tomatoTimer = 0; raccoonTimer = 0;
  bulldogTimer = 0; stegoTimer = 0; trexTimer = 0;
  triceratopsTimer = 0; pumpkinTimer = 0; harderMsgTimer = 0;
  sharkMissiles = 0; activeMissiles = []; dirtBlocks = []; extraBalls = [];
  leftWallHitTime = 0; rightWallHitTime = 0;
  Object.keys(iconAnimState).forEach(k => iconAnimState[k].wasActive = false);
  lastDropTime = performance.now(); lastFrameTime = performance.now();
  gameOverReason = "GAME OVER";
  gameState = "PLAYING";
}

function fireMissile() {
  if (gameState === "PLAYING" && sharkMissiles > 0) {
    sharkMissiles--;
    activeMissiles.push({ x: paddle.x + paddle.w / 2 - 2, y: paddle.y - 15, w: 4, h: 15 });
    playBounceSound();
  }
}

function togglePause() {
  if (gameState === "PLAYING") gameState = "PAUSED";
  else if (gameState === "PAUSED") gameState = "PLAYING";
}

function processPowerup(blockType, currentTime, blockRect) {
  playPowerupSound();
  if (blockType === "basic-blueberry.png") {
    lives += 1;
  } else if (blockType === "armored-walrus.png") {
    walrusTimer = currentTime + 10000;
  } else if (blockType === "tough-tomato.png") {
    ballSize = Math.floor(ballSize * 1.3);
    const cx = ball.x + ball.w / 2; const cy = ball.y + ball.h / 2;
    ball.w = ballSize; ball.h = ballSize;
    ball.x = cx - ballSize / 2; ball.y = cy - ballSize / 2;
    extraBalls.forEach(e => {
      const ecx = e.rect.x + e.rect.w / 2; const ecy = e.rect.y + e.rect.h / 2;
      e.rect.w = ballSize; e.rect.h = ballSize;
      e.rect.x = ecx - ballSize / 2; e.rect.y = ecy - ballSize / 2;
    });
    ballSurface = createBallCanvas(ballSize);
    tomatoTimer = currentTime + 10000;
  } else if (blockType === "aggressive-shark.png") {
    sharkMissiles += 3;
  } else if (blockType === "bandit-raccoon.png") {
    raccoonTimer = currentTime + 5000;
  } else if (blockType === "bulldog-retriever.png") {
    bulldogTimer = currentTime + 10000;
    dirtBlocks = [];
    for (let i = 0; i < 5; i++) {
      dirtBlocks.push({ x: Math.floor(Math.random() * (700 - blockW)) + 50, y: Math.floor(Math.random() * 250) + 200, w: blockW, h: blockH });
    }
  } else if (blockType === "smashing-stegosaurus.png") {
    stegoTimer = currentTime + 10000;
  } else if (blockType === "sneaky-t-rex.png") {
    trexTimer = currentTime + 4000;
  } else if (blockType === "treading-triceratops.png") {
    triceratopsTimer = currentTime + 6000;
    triceratopsDrift = Math.random() < 0.5 ? -3.5 : 3.5;
  } else if (blockType === "charging-gorilla.png") {
    const smashRect = { x: blockRect.x - (blockW + 10), y: blockRect.y - (blockH + 10), w: blockRect.w + (blockW + 10)*2, h: blockRect.h + (blockH + 10)*2 };
    blocks = blocks.filter(b => {
      if (rectsIntersect(b.rect, smashRect)) { score += 10; return false; }
      return true;
    });
  } else if (blockType === "heavy-pumpkin.png") {
    pumpkinTimer = currentTime + 10000;
  } else if (blockType === "stampeding-elephant.png") {
    elephantMsgTimer = currentTime + 3000;
    for (let i = 0; i < 3; i++) {
      extraBalls.push({
        rect: { x: blockRect.x + blockRect.w / 2 - ballSize / 2, y: blockRect.y + blockRect.h / 2 - ballSize / 2, w: ballSize, h: ballSize },
        dx: [-3.8, -3.0, 3.0, 3.8][Math.floor(Math.random() * 4)],
        dy: [-3.8, -3.2][Math.floor(Math.random() * 2)],
        trail: [], angle: 0
      });
    }
  } else {
    score += 50;
  }
}

function checkLevelClear(currentTime) {
  if (blocks.length === 0) {
    dropInterval = Math.max(5000, dropInterval - 2000);
    harderMsgTimer = currentTime + 3000;
    blocks = buildLevel();
    ballSize = 20; ballSurface = createBallCanvas(ballSize);
    ball.w = ballSize; ball.h = ballSize;
    tomatoTimer = 0; raccoonTimer = 0; bulldogTimer = 0; stegoTimer = 0; trexTimer = 0; triceratopsTimer = 0; pumpkinTimer = 0;
    dirtBlocks = []; extraBalls = [];
    ball.x = paddle.x + paddle.w / 2 - ballSize / 2; ball.y = paddle.y - ballSize - 5;
    ball.dy = -BASE_BALL_SPEED; ball.dx = BASE_BALL_SPEED;
    activeMissiles = []; lastDropTime = currentTime;
  }
}

function rectsIntersect(r1, r2) {
  return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}

function handleBlockCollision(bBall, blockList, currentTime) {
  for (let i = 0; i < blockList.length; i++) {
    if (rectsIntersect(bBall, blockList[i].rect)) {
      const hit = blockList.splice(i, 1)[0];
      
      const overlapLeft = (bBall.x + bBall.w) - hit.rect.x;
      const overlapRight = (hit.rect.x + hit.rect.w) - bBall.x;
      const overlapTop = (bBall.y + bBall.h) - hit.rect.y;
      const overlapBottom = (hit.rect.y + hit.rect.h) - bBall.y;
      
      const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
      
      if (minOverlap === overlapTop || minOverlap === overlapBottom) {
        bBall.dy *= -1;
      } else {
        bBall.dx *= -1;
      }
      
      if (hit.is_powerup) {
        processPowerup(hit.type, currentTime, hit.rect);
      } else {
        playBounceSound();
        score += 10;
      }
      checkLevelClear(currentTime);
      return true;
    }
  }
  return false;
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (canvas.width / rect.width),
    y: (clientY - rect.top) * (canvas.height / rect.height)
  };
}

function updateInputPosition(clientX, clientY, currentTime) {
  const coords = getCanvasCoords(clientX, clientY);
  mouseX = coords.x; mouseY = coords.y;
  const controlsInverted = currentTime < raccoonTimer;
  let intendedX = coords.x - paddle.w / 2;
  if (controlsInverted) intendedX = (800 - coords.x) - paddle.w / 2;
  inputX = Math.max(0, Math.min(800 - paddle.w, intendedX));
}

let lastTap = 0;
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const currentTime = new Date().getTime();
  const tapLength = currentTime - lastTap;
  if (tapLength < 300 && tapLength > 0) {
    if (!document.fullscreenElement) canvas.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  }
  lastTap = currentTime;

  isInteracting = true;
  const t = e.touches[0];
  const coords = getCanvasCoords(t.clientX, t.clientY);
  mouseX = coords.x; mouseY = coords.y;

  if (gameState === "START_SCREEN") {
    if (mouseX >= 300 && mouseX <= 500 && mouseY >= 115 && mouseY <= 170) startNewGame();
  } else if (gameState === "GAME_OVER" && gameOverY >= 150) {
    if (mouseX >= 300 && mouseX <= 500 && mouseY >= 350 && mouseY <= 410) startNewGame();
  } else if (gameState === "PLAYING") {
    updateInputPosition(t.clientX, t.clientY, performance.now());
  }
}, { passive: false });

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (isInteracting && gameState === "PLAYING") {
    updateInputPosition(e.touches[0].clientX, e.touches[0].clientY, performance.now());
  }
}, { passive: false });

window.addEventListener("touchend", e => { if (e.touches.length === 0) isInteracting = false; });

pauseBtn.addEventListener("touchstart", e => { e.preventDefault(); togglePause(); pauseBtn.innerText = gameState === "PAUSED" ? "RESUME" : "PAUSE"; });
pauseBtn.addEventListener("click", () => { togglePause(); pauseBtn.innerText = gameState === "PAUSED" ? "RESUME" : "PAUSE"; });
missileBtn.addEventListener("touchstart", e => { e.preventDefault(); fireMissile(); });
missileBtn.addEventListener("click", fireMissile);

canvas.addEventListener("dblclick", e => {
  e.preventDefault();
  if (!document.fullscreenElement) canvas.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

// --- KEYBOARD & MOUSE LISTENERS ---
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "KeyA" || e.code === "KeyD") {
    isInteracting = false; 
  }
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.code === "Digit1") fireMissile();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

canvas.addEventListener("mousemove", e => {
  if (gameState === "PLAYING") {
     isInteracting = true;
     updateInputPosition(e.clientX, e.clientY, performance.now());
  } else {
    const coords = getCanvasCoords(e.clientX, e.clientY);
    mouseX = coords.x; mouseY = coords.y;
  }
});

canvas.addEventListener("mousedown", e => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (e.button === 0) {
    if (gameState === "START_SCREEN") {
      if (mouseX >= 300 && mouseX <= 500 && mouseY >= 115 && mouseY <= 170) startNewGame();
    } else if (gameState === "GAME_OVER" && gameOverY >= 150) {
      if (mouseX >= 300 && mouseX <= 500 && mouseY >= 350 && mouseY <= 410) startNewGame();
    }
  }
});

// --- MAIN LOOP ---
function update(currentTime) {
  if (gameState !== "PLAYING") { lastFrameTime = currentTime; return; }

  const dt = Math.min((currentTime - lastFrameTime) / 16.667, 2.0);
  lastFrameTime = currentTime;

  if (currentTime - lastDropTime >= dropInterval) {
    lastDropTime = currentTime;
    
    blocks.forEach(b => {
      b.rect.y += (blockH + 5);
      if (b.rect.y + b.rect.h >= paddle.y) {
        gameState = "GAME_OVER"; gameOverReason = "CRUSHED"; gameOverY = -120;
      }
    });

    if (gameState === "PLAYING") {
      const rowSpecialCols = new Set();
      while (rowSpecialCols.size < 3) rowSpecialCols.add(Math.floor(Math.random() * 16));
      for (let col = 0; col < 16; col++) {
        const rect = { x: col * (blockW + 5) + 24, y: 50, w: blockW, h: blockH };
        if (rowSpecialCols.has(col)) {
          const critter = getRandomCritter(0);
          blocks.push({ rect, is_powerup: true, type: critter.name, color: critter.color });
        } else {
          blocks.push({ rect, is_powerup: false, type: 'generic' });
        }
      }
    }
  }

  const currentSpeed = ((keys["ShiftLeft"] || keys["ShiftRight"]) ? basePaddleSpeed * 1.8 : basePaddleSpeed) * dt;
  const controlsInverted = currentTime < raccoonTimer;
  
  const pressingLeft = keys["ArrowLeft"] || keys["KeyA"];
  const pressingRight = keys["ArrowRight"] || keys["KeyD"];
  
  const leftKey = controlsInverted ? pressingRight : pressingLeft;
  const rightKey = controlsInverted ? pressingLeft : pressingRight;

  if (isInteracting) {
    paddle.x += (inputX - paddle.x) * Math.min(1.0, 0.3 * dt);
  } else {
    if (leftKey) paddle.x -= currentSpeed;
    if (rightKey) paddle.x += currentSpeed;
  }
  
  if (currentTime < triceratopsTimer) paddle.x += triceratopsDrift * dt;
  if (paddle.x < 0) paddle.x = 0;
  if (paddle.x + paddle.w > 800) paddle.x = 800 - paddle.w;

  if (tomatoTimer > 0 && currentTime > tomatoTimer) {
    tomatoTimer = 0; ballSize = 20;
    const cx = ball.x + ball.w / 2; const cy = ball.y + ball.h / 2;
    ball.w = ballSize; ball.h = ballSize;
    ball.x = cx - ballSize / 2; ball.y = cy - ballSize / 2;
    extraBalls.forEach(e => {
      const ecx = e.rect.x + e.rect.w / 2; const ecy = e.rect.y + e.rect.h / 2;
      e.rect.w = ballSize; e.rect.h = ballSize;
      e.rect.x = ecx - ballSize / 2; e.rect.y = ecy - ballSize / 2;
    });
    ballSurface = createBallCanvas(ballSize);
  }

  if (bulldogTimer > 0 && currentTime > bulldogTimer) { bulldogTimer = 0; dirtBlocks = []; }

  const isWalrusActive = currentTime < walrusTimer;
  const isStegoActive = currentTime < stegoTimer;
  const paddleHitboxes = [];
  if (isWalrusActive) paddleHitboxes.push({ x: paddle.x + paddle.w / 2 - 100, y: paddle.y - 10, w: 200, h: 30 });
  else if (isStegoActive) {
    paddleHitboxes.push({ x: paddle.x, y: paddle.y, w: 16, h: 15 });
    paddleHitboxes.push({ x: paddle.x + paddle.w / 2 - 8, y: paddle.y, w: 16, h: 15 });
    paddleHitboxes.push({ x: paddle.x + paddle.w - 16, y: paddle.y, w: 16, h: 15 });
  } else paddleHitboxes.push(paddle);

  activeMissiles = activeMissiles.filter(m => {
    m.y -= 10 * dt;
    if (m.y + m.h < 0) return false;
    for (let dirt of dirtBlocks) { if (rectsIntersect(m, dirt)) return false; }
    for (let i = 0; i < blocks.length; i++) {
      if (rectsIntersect(m, blocks[i].rect)) {
        const hit = blocks.splice(i, 1)[0];
        if (hit.is_powerup) processPowerup(hit.type, currentTime, hit.rect);
        else { playBounceSound(); score += 10; }
        checkLevelClear(currentTime);
        return false;
      }
    }
    return true;
  });

  ballTrail.push({ x: ball.x + ball.w / 2, y: ball.y + ball.h / 2 });
  if (ballTrail.length > 10) ballTrail.shift();

  if (Math.abs(ball.dy) < BASE_BALL_SPEED * 0.3) {
    ball.dy = ball.dy < 0 ? -BASE_BALL_SPEED * 0.3 : BASE_BALL_SPEED * 0.3;
  }

  ball.x += ball.dx * dt;
  ball.y += ball.dy * dt;
  ball.angle -= 0.06 * dt;

  if (ball.x <= 0) { 
    ball.x = 0; 
    ball.dx = Math.abs(ball.dx); 
    playBounceSound(); 
    leftWallHitTime = currentTime;
  } else if (ball.x + ball.w >= 800) { 
    ball.x = 800 - ball.w; 
    ball.dx = -Math.abs(ball.dx); 
    playBounceSound(); 
    rightWallHitTime = currentTime;
  }

  if (ball.y <= 0) { ball.y = 0; ball.dy = Math.abs(ball.dy); playBounceSound(); }

  if (ball.y + ball.h >= 600) {
    if (extraBalls.length > 0) {
      const replacement = extraBalls.shift();
      ball.x = replacement.rect.x; ball.y = replacement.rect.y;
      ball.dx = replacement.dx; ball.dy = replacement.dy;
      ballTrail = replacement.trail; ball.angle = replacement.angle;
    } else {
      lives--; ballSize = 20;
      ballSurface = createBallCanvas(ballSize);
      ball.w = ballSize; ball.h = ballSize;
      ball.x = paddle.x + paddle.w / 2 - ballSize / 2; ball.y = paddle.y - ballSize - 5;
      ball.dy = -BASE_BALL_SPEED; ball.dx = BASE_BALL_SPEED;
      tomatoTimer = 0; raccoonTimer = 0; bulldogTimer = 0; stegoTimer = 0; trexTimer = 0;
      triceratopsTimer = 0; pumpkinTimer = 0; dirtBlocks = []; extraBalls = []; ballTrail = [];
      if (lives <= 0) { gameState = "GAME_OVER"; gameOverReason = "GAME OVER"; gameOverY = -120; } 
      else lastDropTime = currentTime;
    }
  }

  for (let hitBox of paddleHitboxes) {
    if (rectsIntersect(ball, hitBox) && ball.dy > 0) {
      const hitPos = ((ball.x + ball.w / 2) - (hitBox.x + hitBox.w / 2)) / (hitBox.w / 2);
      ball.dx = Math.max(-5.5, Math.min(5.5, hitPos * 5.2));
      ball.dy = -Math.abs(ball.dy);
      playBounceSound();
      if (currentTime < pumpkinTimer) {
        shakeTimer = currentTime + 300; let destroyed = 0;
        while (destroyed < 3 && blocks.length > 0) {
          const target = blocks.splice(Math.floor(Math.random() * blocks.length), 1)[0];
          score += target.is_powerup ? 50 : 10; destroyed++;
        }
        checkLevelClear(currentTime);
      }
      break;
    }
  }

  for (let dirt of dirtBlocks) {
    if (rectsIntersect(ball, dirt)) { ball.dy *= -1; playBounceSound(); break; }
  }

  const bBall = { x: ball.x, y: ball.y, w: ball.w, h: ball.h, dx: ball.dx, dy: ball.dy };
  if (handleBlockCollision(bBall, blocks, currentTime)) {
    ball.dx = bBall.dx;
    ball.dy = bBall.dy;
  }

  extraBalls = extraBalls.filter(eBall => {
    eBall.trail.push({ x: eBall.rect.x + eBall.rect.w / 2, y: eBall.rect.y + eBall.rect.h / 2 });
    if (eBall.trail.length > 8) eBall.trail.shift();

    if (Math.abs(eBall.dy) < BASE_BALL_SPEED * 0.3) {
      eBall.dy = eBall.dy < 0 ? -BASE_BALL_SPEED * 0.3 : BASE_BALL_SPEED * 0.3;
    }

    eBall.rect.x += eBall.dx * dt; eBall.rect.y += eBall.dy * dt;
    eBall.angle -= 0.06 * dt;

    if (eBall.rect.x <= 0) { 
      eBall.rect.x = 0; 
      eBall.dx = Math.abs(eBall.dx); 
      playBounceSound(); 
      leftWallHitTime = currentTime;
    } 
    else if (eBall.rect.x + eBall.rect.w >= 800) { 
      eBall.rect.x = 800 - eBall.rect.w; 
      eBall.dx = -Math.abs(eBall.dx); 
      playBounceSound(); 
      rightWallHitTime = currentTime;
    }
    if (eBall.rect.y <= 0) { eBall.rect.y = 0; eBall.dy = Math.abs(eBall.dy); playBounceSound(); }
    if (eBall.rect.y + eBall.rect.h >= 600) return false;

    for (let hitBox of paddleHitboxes) {
      if (rectsIntersect(eBall.rect, hitBox) && eBall.dy > 0) {
        const hitPos = ((eBall.rect.x + eBall.rect.w / 2) - (hitBox.x + hitBox.w / 2)) / (hitBox.w / 2);
        eBall.dx = Math.max(-5.5, Math.min(5.5, hitPos * 5.2));
        eBall.dy = -Math.abs(eBall.dy);
        playBounceSound();
        if (currentTime < pumpkinTimer) {
          shakeTimer = currentTime + 300; let destroyed = 0;
          while (destroyed < 3 && blocks.length > 0) {
            const target = blocks.splice(Math.floor(Math.random() * blocks.length), 1)[0];
            score += target.is_powerup ? 50 : 10; destroyed++;
          }
          checkLevelClear(currentTime);
        }
        break;
      }
    }

    for (let dirt of dirtBlocks) {
      if (rectsIntersect(eBall.rect, dirt)) { eBall.dy *= -1; playBounceSound(); break; }
    }

    const exBall = { x: eBall.rect.x, y: eBall.rect.y, w: eBall.rect.w, h: eBall.rect.h, dx: eBall.dx, dy: eBall.dy };
    if (handleBlockCollision(exBall, blocks, currentTime)) {
      eBall.dx = exBall.dx;
      eBall.dy = exBall.dy;
    }

    return true;
  });
}

// --- RENDER FUNCTION ---
function render(currentTime) {
  if (sharkMissiles > 0 && gameState === "PLAYING") {
    missileBtn.style.display = "flex"; missileBtn.innerText = `FIRE 🚀 (${sharkMissiles})`;
  } else { missileBtn.style.display = "none"; }

  if (gameState === "START_SCREEN") {
    pauseBtn.style.display = "none";
    ctx.fillStyle = "rgb(20, 22, 32)"; ctx.fillRect(0, 0, 800, 600);
    const boxX = 35, boxY = 20, boxW = 730, boxH = 560;
    ctx.fillStyle = "rgb(28, 32, 48)"; ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = "rgb(100, 200, 255)"; ctx.lineWidth = 3; ctx.strokeRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = "rgb(40, 90, 140)"; ctx.lineWidth = 2; ctx.strokeRect(boxX + 4, boxY + 4, boxW - 8, boxH - 8);

    ctx.fillStyle = "rgb(255, 205, 30)"; ctx.font = "bold 44px Impact"; ctx.textAlign = "center";
    ctx.fillText("Corner Critters: 'Breakout'", 400, 70);
    ctx.fillStyle = "rgb(180, 215, 255)"; ctx.font = "16px Arial";
    ctx.fillText("An Arcade Brick-Breaker with Wild Power-ups & Hazards", 400, 96);

    const isBtnHover = (mouseX >= 300 && mouseX <= 500 && mouseY >= 115 && mouseY <= 170);
    ctx.fillStyle = isBtnHover ? "rgb(150, 255, 150)" : "rgb(90, 210, 90)";
    roundRect(ctx, 300, 115, 200, 55, 8, true, false);
    ctx.strokeStyle = "rgb(255, 255, 255)"; ctx.lineWidth = 2;
    roundRect(ctx, 300, 115, 200, 55, 8, false, true);
    ctx.fillStyle = "rgb(10, 25, 10)"; ctx.font = "bold 30px Impact"; ctx.textAlign = "center";
    ctx.fillText("NEW GAME", 400, 153);

    ctx.fillStyle = "rgba(15, 18, 28, 0.75)"; roundRect(ctx, 55, 185, 690, 85, 6, true, false);
    ctx.strokeStyle = "rgb(60, 95, 140)"; ctx.lineWidth = 1.5; roundRect(ctx, 55, 185, 690, 85, 6, false, true);
    ctx.fillStyle = "rgb(255, 220, 110)"; ctx.font = "bold 16px Arial"; ctx.textAlign = "left";
    ctx.fillText("RULES & CONTROLS:", 70, 208);
    ctx.fillStyle = "rgb(230, 235, 245)"; ctx.font = "14px Arial";
    ctx.fillText("• Double-click / Double-tap background to toggle fullscreen fluidly.", 70, 230);
    ctx.fillText("• The grid falls endlessly. Destroy blocks before they hit your paddle line to survive.", 70, 248);
    ctx.fillText("• PC: Mouse/WASD/Arrows | Mobile: Drag on screen.", 70, 265);

    ctx.fillStyle = "rgb(120, 200, 255)"; ctx.font = "bold 17px Arial"; ctx.textAlign = "center";
    ctx.fillText("CRITTER POWER-UPS & HAZARD GUIDE", 400, 298);

    const keysArr = Object.keys(iconDescriptions);
    keysArr.forEach((key, idx) => {
      const col = idx % 2, row = Math.floor(idx / 2);
      const curX = 65 + col * 345, curY = 320 + row * 56;
      if (statusIcons[key]) ctx.drawImage(statusIcons[key], curX, curY);
      ctx.fillStyle = "rgb(240, 240, 240)"; ctx.font = "13px Arial"; ctx.textAlign = "left";
      const words = iconDescriptions[key].split(" ");
      let line = "", lineY = curY + 14;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        if (ctx.measureText(testLine).width > 285 && n > 0) {
          ctx.fillText(line, curX + 42, lineY); line = words[n] + " "; lineY += 16;
        } else line = testLine;
      }
      ctx.fillText(line, curX + 42, lineY);
    });
    return;
  }

  if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
    pauseBtn.style.display = gameState === "GAME_OVER" ? "none" : "flex";
  }

  let shakeX = 0, shakeY = 0;
  if (currentTime < shakeTimer) { shakeX = Math.floor(Math.random() * 17) - 8; shakeY = Math.floor(Math.random() * 17) - 8; }
  ctx.save(); ctx.translate(shakeX, shakeY);

  ctx.fillStyle = "rgb(30, 30, 30)"; ctx.fillRect(0, 0, 800, 600);

  // Render Wall Barriers and Glows
  let leftGlow = Math.max(0, 1 - (currentTime - leftWallHitTime) / 300);
  let rightGlow = Math.max(0, 1 - (currentTime - rightWallHitTime) / 300);

  // Left edge
  ctx.fillStyle = `rgba(100, 200, 255, ${0.15 + leftGlow * 0.6})`;
  ctx.fillRect(0, 0, 3, 600);
  if (leftGlow > 0) {
    let lGrad = ctx.createLinearGradient(3, 0, 15, 0);
    lGrad.addColorStop(0, `rgba(100, 200, 255, ${leftGlow * 0.4})`);
    lGrad.addColorStop(1, `rgba(100, 200, 255, 0)`);
    ctx.fillStyle = lGrad;
    ctx.fillRect(3, 0, 12, 600);
  }

  // Right edge
  ctx.fillStyle = `rgba(100, 200, 255, ${0.15 + rightGlow * 0.6})`;
  ctx.fillRect(797, 0, 3, 600);
  if (rightGlow > 0) {
    let rGrad = ctx.createLinearGradient(797, 0, 785, 0);
    rGrad.addColorStop(0, `rgba(100, 200, 255, ${rightGlow * 0.4})`);
    rGrad.addColorStop(1, `rgba(100, 200, 255, 0)`);
    ctx.fillStyle = rGrad;
    ctx.fillRect(785, 0, 12, 600);
  }

  if (gameState === "PLAYING" || gameState === "PAUSED") {
    ctx.fillStyle = "rgb(200, 200, 200)";
    if (currentTime < stegoTimer) {
      ctx.fillRect(paddle.x, paddle.y, 16, 15); ctx.fillRect(paddle.x + paddle.w / 2 - 8, paddle.y, 16, 15); ctx.fillRect(paddle.x + paddle.w - 16, paddle.y, 16, 15);
    } else ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

    if (currentTime < walrusTimer) {
      const pulse = (175 + 80 * Math.sin(currentTime / 100.0)) / 255; ctx.save();
      ctx.fillStyle = `rgba(0, 255, 255, ${pulse})`; ctx.beginPath();
      ctx.ellipse(paddle.x + paddle.w / 2, paddle.y - 10 + 15, 100, 15, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.restore();
    }

    ctx.fillStyle = "rgb(255, 100, 50)";
    activeMissiles.forEach(m => ctx.fillRect(m.x, m.y, m.w, m.h));

    const timeSinceDrop = currentTime - lastDropTime;
    const isBlinking = timeSinceDrop > (dropInterval - 3000) && gameState === "PLAYING";
    const blinkAlpha = isBlinking ? Math.abs(Math.sin(currentTime / 100.0)) * 0.4 : 0;

    dirtBlocks.forEach(d => ctx.drawImage(dirtSurface, d.x, d.y));

    // NEW STYLIZED COLORED BLOCKS
    blocks.forEach(b => {
      if (b.is_powerup) {
        // Main Color
        ctx.fillStyle = b.color;
        ctx.fillRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h);
        
        // Inner Glow / Arcade Detail
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 2;
        ctx.strokeRect(b.rect.x + 2, b.rect.y + 2, b.rect.w - 4, b.rect.h - 4);
        
        // Center gem highlight
        ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
        ctx.fillRect(b.rect.x + b.rect.w/2 - 6, b.rect.y + b.rect.h/2 - 6, 12, 12);
      } else {
        ctx.drawImage(genericBlock, b.rect.x, b.rect.y);
      }

      if (isBlinking) {
        ctx.fillStyle = `rgba(255, 255, 255, ${blinkAlpha})`;
        ctx.fillRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h);
      }
    });

    ballTrail.forEach((pos, i) => {
      const radius = (ballSize / 2) * (i / ballTrail.length);
      const alpha = (i / ballTrail.length) * 0.7;
      if (radius > 0) {
        ctx.fillStyle = `rgba(220, 60, 60, ${alpha})`; ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2); ctx.fill();
      }
    });

    if (currentTime < trexTimer) {
      // Cloaked: Draw nothing for the main ball surface
    } else {
      ctx.save(); ctx.translate(ball.x + ball.w / 2, ball.y + ball.h / 2);
      ctx.rotate(ball.angle); ctx.drawImage(ballSurface, -ball.w / 2, -ball.h / 2); ctx.restore();
    }

    extraBalls.forEach(eBall => {
      eBall.trail.forEach((pos, i) => {
        const radius = (ballSize / 2) * (i / eBall.trail.length);
        const alpha = (i / eBall.trail.length) * 0.7;
        if (radius > 0) {
          ctx.fillStyle = `rgba(220, 60, 60, ${alpha})`; ctx.beginPath();
          ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2); ctx.fill();
        }
      });
      if (currentTime < trexTimer) {
        // Cloaked: Draw nothing for the extra ball surface
      } else {
        ctx.save(); ctx.translate(eBall.rect.x + eBall.rect.w / 2, eBall.rect.y + eBall.rect.h / 2);
        ctx.rotate(eBall.angle); ctx.drawImage(ballSurface, -eBall.rect.w / 2, -eBall.rect.h / 2); ctx.restore();
      }
    });

    ctx.fillStyle = "rgb(255, 255, 255)"; ctx.font = "bold 26px Arial"; ctx.textAlign = "left";
    ctx.fillText(`Lives: ${lives}`, 20, 40);
    ctx.textAlign = "right"; ctx.fillText(`Score: ${score}`, 780, 40);

    const currentActive = [];
    if (currentTime < walrusTimer) currentActive.push('walrus');
    if (currentTime < tomatoTimer) currentActive.push('tomato');
    if (currentTime < raccoonTimer) currentActive.push('raccoon');
    if (currentTime < stegoTimer) currentActive.push('stego');
    if (currentTime < trexTimer) currentActive.push('trex');
    if (currentTime < triceratopsTimer) currentActive.push('triceratops');
    if (currentTime < pumpkinTimer) currentActive.push('pumpkin');
    if (sharkMissiles > 0) currentActive.push('shark');

    let iconX = 20, iconY = 60;
    Object.keys(iconFilenames).forEach(key => {
      if (currentActive.includes(key)) {
        const state = iconAnimState[key];
        if (!state.wasActive) { state.offset = 40; state.angle = 0; state.wasActive = true; }
        if (state.offset > 0) state.offset = Math.max(0, state.offset - 4);
        else if (state.angle > -0.174) state.angle -= 0.035;
        
        if (statusIcons[key]) {
          ctx.save(); ctx.translate(iconX + 16, iconY + 16 + state.offset);
          ctx.rotate(state.angle); ctx.drawImage(statusIcons[key], -16, -16); ctx.restore();
        }
        if (key === 'shark') {
          ctx.fillStyle = "rgb(200, 200, 200)"; ctx.font = "16px Arial"; ctx.textAlign = "left";
          ctx.fillText(`[1] x ${sharkMissiles}`, iconX + 40, iconY + 22 + state.offset);
        }
        iconY += 36;
      } else iconAnimState[key].wasActive = false;
    });

    const standardWarnings = [];
    if (currentTime < elephantMsgTimer) standardWarnings.push({ text: "THE HERD! (MULTI-BALL)", color: "rgb(50, 255, 255)" });
    if (currentTime < pumpkinTimer) standardWarnings.push({ text: "SEISMIC PADDLE!", color: "rgb(255, 140, 0)" });
    if (currentTime < raccoonTimer) standardWarnings.push({ text: "CONTROLS INVERTED!", color: "rgb(255, 50, 50)" });
    if (currentTime < trexTimer) standardWarnings.push({ text: "BALL CLOAKED!", color: "rgb(100, 255, 100)" });
    if (currentTime < triceratopsTimer) standardWarnings.push({ text: "STAMPEDE DRIFT!", color: "rgb(255, 150, 0)" });

    ctx.font = "bold 24px Arial"; ctx.textAlign = "center";
    standardWarnings.forEach((warn, idx) => { 
      ctx.fillStyle = warn.color; 
      ctx.fillText(warn.text, 400, 90 + idx * 36); 
    });

    ctx.fillStyle = "rgb(150, 150, 150)"; ctx.font = "16px Arial"; ctx.textAlign = "center";
    ctx.fillText("Double Click/Tap for Fullscreen | SPACE: Pause", 400, 580);

    if (gameState === "PAUSED") {
      ctx.fillStyle = "rgba(15, 15, 25, 0.9)"; ctx.fillRect(0, 0, 800, 600);
      const boxX = 70, boxY = 30, boxW = 660, boxH = 540;
      ctx.fillStyle = "rgb(25, 28, 42)"; ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = "rgb(100, 200, 255)"; ctx.lineWidth = 3; ctx.strokeRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = "rgb(40, 90, 140)"; ctx.lineWidth = 2; ctx.strokeRect(boxX + 4, boxY + 4, boxW - 8, boxH - 8);

      ctx.fillStyle = "rgb(255, 200, 0)"; ctx.font = "bold 56px Impact"; ctx.textAlign = "center";
      ctx.fillText("PAUSED", 400, 92);
      ctx.fillStyle = "rgb(180, 215, 255)"; ctx.font = "18px Arial";
      ctx.fillText("STATUS EFFECTS & HAZARD GUIDE", 400, 126);

      let startY = 150;
      Object.keys(iconDescriptions).forEach(key => {
        if (statusIcons[key]) {
          ctx.drawImage(statusIcons[key], 140, startY);
          ctx.fillStyle = "rgb(240, 240, 240)"; ctx.font = "16px Arial"; ctx.textAlign = "left";
          ctx.fillText(iconDescriptions[key], 188, startY + 21);
        }
        startY += 42;
      });
      ctx.fillStyle = "rgb(100, 255, 100)"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
      ctx.fillText("Press SPACE / Resume Button", 400, 532);
    }
  } else if (gameState === "GAME_OVER") {
    pauseBtn.style.display = "none";
    if (gameOverY < 150) gameOverY += 5;
    ctx.fillStyle = "rgb(255, 50, 50)"; ctx.font = "bold 88px Impact"; ctx.textAlign = "center";
    ctx.fillText(gameOverReason, 400, gameOverY);

    if (gameOverY >= 150) {
      const isHover = (mouseX >= 300 && mouseX <= 500 && mouseY >= 350 && mouseY <= 410);
      ctx.fillStyle = isHover ? "rgb(150, 255, 150)" : "rgb(100, 200, 100)";
      ctx.fillRect(300, 350, 200, 60);
      ctx.fillStyle = "rgb(0, 0, 0)"; ctx.font = "bold 28px Impact"; ctx.fillText("NEW GAME", 400, 390);
    }
  }
  ctx.restore();
}

function gameLoop(time) { update(time); render(time); requestAnimationFrame(gameLoop); }
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
