<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Critters Breakout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      background-color: rgb(30, 30, 30);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.85);
      border: 2px solid #333;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- SYNTHESIZED SOUND VIA WEB AUDIO API ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBounceSound() {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;

  osc.type = "sine";
  osc.frequency.setValueAtTime(1410, now);
  osc.frequency.exponentialRampToValueAtTime(1350, now + 0.1);

  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.1);
}

// --- ASSET LOADER ---
const critterFiles = [
  "aggressive-shark.png", "armored-walrus.png", "bandit-raccoon.png",
  "basic-blueberry.png", "bulldog-retriever.png", "charging-gorilla.png",
  "heavy-pumpkin.png", "smashing-stegosaurus.png", "sneaky-t-rex.png",
  "stampeding-elephant.png", "tough-tomato.png", "treading-triceratops.png"
];

const loadedCritters = [];
critterFiles.forEach(fileName => {
  const img = new Image();
  img.src = `images/${fileName}`;
  img.onload = () => {
    // Generate square center-cropped offscreen canvas
    const cropSize = Math.min(img.width, img.height);
    const left = Math.floor((img.width - cropSize) / 2);
    const offscreen = document.createElement("canvas");
    offscreen.width = 42;
    offscreen.height = 42;
    const octx = offscreen.getContext("2d");
    octx.drawImage(img, left, 0, cropSize, cropSize, 0, 0, 42, 42);
    loadedCritters.push({ img: offscreen, name: fileName });
  };
});

// Load Status Icons with Whitish Badge Tile
const iconFilenames = {
  walrus: 'shield.png',
  tomato: 'large_ball.png',
  shark: 'missiles_loaded.png',
  raccoon: 'inverted_controls.png',
  stego: 'shattered_paddle.png',
  trex: 'invisible_ball.png',
  triceratops: 'momentum_drift.png',
  pumpkin: 'seismic_paddle.png'
};

const iconDescriptions = {
  walrus: 'Protective barrier forms underneath the paddle',
  tomato: 'Enlarges the ball to plow through multiple blocks',
  shark: 'Loads active missiles into paddle [Press 1 to fire]',
  raccoon: 'Inverts paddle movement controls horizontally',
  stego: 'Fractures the paddle into 3 separated segments',
  trex: 'Cloaks the ball, revealing only its path trail',
  triceratops: 'Forces continuous sideways momentum drift',
  pumpkin: 'Heavy paddle triggers earthquakes that break blocks'
};

const statusIcons = {};
const iconAnimState = {};

Object.keys(iconFilenames).forEach(key => {
  iconAnimState[key] = { offset: 0, angle: 0, wasActive: false };
  const rawImg = new Image();
  rawImg.src = `icons/${iconFilenames[key]}`;
  rawImg.onload = () => {
    const tile = document.createElement("canvas");
    tile.width = 32;
    tile.height = 32;
    const tctx = tile.getContext("2d");

    // Draw whitish rounded badge tile
    tctx.fillStyle = "rgb(230, 235, 245)";
    roundRect(tctx, 0, 0, 32, 32, 4, true, false);
    tctx.strokeStyle = "rgb(160, 180, 210)";
    tctx.lineWidth = 1;
    roundRect(tctx, 0.5, 0.5, 31, 31, 4, false, true);

    tctx.drawImage(rawImg, 1, 1, 30, 30);
    statusIcons[key] = tile;
  };
  rawImg.onerror = () => {
    const tile = document.createElement("canvas");
    tile.width = 32;
    tile.height = 32;
    const tctx = tile.getContext("2d");
    tctx.fillStyle = "magenta";
    tctx.fillRect(0, 0, 32, 32);
    statusIcons[key] = tile;
  };
});

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// --- GAME STATE & VARIABLES ---
let score = 0;
let lives = 3;
let rowsRemaining = 3;
let gameState = "PLAYING";
let gameOverY = -120;
let ballTrail = [];

let walrusTimer = 0;
let tomatoTimer = 0;
let raccoonTimer = 0;
let bulldogTimer = 0;
let stegoTimer = 0;
let trexTimer = 0;
let triceratopsTimer = 0;
let pumpkinTimer = 0;
let shakeTimer = 0;
let elephantMsgTimer = 0;
let triceratopsDrift = 0;
let sharkMissiles = 0;

let activeMissiles = [];
let dirtBlocks = [];
let extraBalls = [];

const blockW = 42;
const blockH = 42;
let blocks = [];

let lastDropTime = performance.now();
const dropInterval = 15000;

const paddle = { x: 350, y: 550, w: 100, h: 15 };
const basePaddleSpeed = 7;

let ballSize = 20;
const ball = { x: 390, y: 300, w: ballSize, h: ballSize, dx: 5, dy: -5, angle: 0 };

const keys = {};
let mouseX = 0, mouseY = 0;

// Offscreen Ball Canvas
function createBallCanvas(size) {
  const bSurf = document.createElement("canvas");
  bSurf.width = size;
  bSurf.height = size;
  const bctx = bSurf.getContext("2d");
  const radius = size / 2;
  const lineW = Math.max(2, Math.floor(size / 6));

  bctx.fillStyle = "rgb(255, 100, 100)";
  bctx.beginPath();
  bctx.arc(radius, radius, radius, 0, Math.PI * 2);
  bctx.fill();

  bctx.strokeStyle = "rgb(255, 255, 255)";
  bctx.lineWidth = lineW;
  bctx.beginPath();
  bctx.moveTo(radius, 0);
  bctx.lineTo(radius, size);
  bctx.moveTo(0, radius);
  bctx.lineTo(size, radius);
  bctx.stroke();

  return bSurf;
}
let ballSurface = createBallCanvas(ballSize);

// Generic block canvas
const genericBlock = document.createElement("canvas");
genericBlock.width = blockW;
genericBlock.height = blockH;
const gctx = genericBlock.getContext("2d");
gctx.fillStyle = "rgb(100, 150, 200)";
gctx.fillRect(0, 0, blockW, blockH);
gctx.strokeStyle = "rgb(50, 100, 150)";
gctx.lineWidth = 3;
gctx.strokeRect(0, 0, blockW, blockH);

// Dirt block canvas
const dirtSurface = document.createElement("canvas");
dirtSurface.width = blockW;
dirtSurface.height = blockH;
const dctx = dirtSurface.getContext("2d");
dctx.fillStyle = "rgb(120, 80, 40)";
dctx.fillRect(0, 0, blockW, blockH);
dctx.strokeStyle = "rgb(80, 50, 20)";
dctx.lineWidth = 3;
dctx.strokeRect(0, 0, blockW, blockH);

function buildLevel() {
  const list = [];
  for (let row = 0; row < 6; row++) {
    for (let col = 0; col < 16; col++) {
      const rect = { x: col * (blockW + 5) + 24, y: row * (blockH + 5) + 50, w: blockW, h: blockH };
      if (Math.random() < 0.15 && loadedCritters.length > 0) {
        let critter;
        const weights = loadedCritters.map(c => {
          if (c.name === "basic-blueberry.png") {
            return row < 2 ? 70 : (row < 4 ? 20 : 10);
          }
          return 10;
        });
        const totalWeight = weights.reduce((a, b) => a + b, 0);
        let rand = Math.random() * totalWeight;
        for (let i = 0; i < loadedCritters.length; i++) {
          if (rand < weights[i]) {
            critter = loadedCritters[i];
            break;
          }
          rand -= weights[i];
        }
        critter = critter || loadedCritters[0];
        list.push({ rect, image: critter.img, is_powerup: true, type: critter.name });
      } else {
        list.push({ rect, image: genericBlock, is_powerup: false, type: 'generic' });
      }
    }
  }
  return list;
}

blocks = buildLevel();

function processPowerup(blockType, currentTime, blockRect) {
  if (blockType === "basic-blueberry.png") {
    lives += 1;
  } else if (blockType === "armored-walrus.png") {
    walrusTimer = currentTime + 10000;
  } else if (blockType === "tough-tomato.png") {
    ballSize = Math.floor(ballSize * 1.3);
    const cx = ball.x + ball.w / 2;
    const cy = ball.y + ball.h / 2;
    ball.w = ballSize;
    ball.h = ballSize;
    ball.x = cx - ballSize / 2;
    ball.y = cy - ballSize / 2;

    extraBalls.forEach(e => {
      const ecx = e.rect.x + e.rect.w / 2;
      const ecy = e.rect.y + e.rect.h / 2;
      e.rect.w = ballSize;
      e.rect.h = ballSize;
      e.rect.x = ecx - ballSize / 2;
      e.rect.y = ecy - ballSize / 2;
    });

    ballSurface = createBallCanvas(ballSize);
    tomatoTimer = currentTime + 10000;
  } else if (blockType === "aggressive-shark.png") {
    sharkMissiles += 3;
  } else if (blockType === "bandit-raccoon.png") {
    raccoonTimer = currentTime + 5000;
  } else if (blockType === "bulldog-retriever.png") {
    bulldogTimer = currentTime + 10000;
    dirtBlocks = [];
    for (let i = 0; i < 5; i++) {
      const rx = Math.floor(Math.random() * (700 - blockW)) + 50;
      const ry = Math.floor(Math.random() * 250) + 200;
      dirtBlocks.push({ x: rx, y: ry, w: blockW, h: blockH });
    }
  } else if (blockType === "smashing-stegosaurus.png") {
    stegoTimer = currentTime + 10000;
  } else if (blockType === "sneaky-t-rex.png") {
    trexTimer = currentTime + 4000;
  } else if (blockType === "treading-triceratops.png") {
    triceratopsTimer = currentTime + 6000;
    triceratopsDrift = Math.random() < 0.5 ? -5 : 5;
  } else if (blockType === "charging-gorilla.png") {
    const inflateW = (blockW + 10) * 2;
    const inflateH = (blockH + 10) * 2;
    const smashRect = {
      x: blockRect.x - inflateW / 2,
      y: blockRect.y - inflateH / 2,
      w: blockRect.w + inflateW,
      h: blockRect.h + inflateH
    };
    blocks = blocks.filter(b => {
      if (rectsIntersect(b.rect, smashRect)) {
        score += 10;
        return false;
      }
      return true;
    });
  } else if (blockType === "heavy-pumpkin.png") {
    pumpkinTimer = currentTime + 10000;
  } else if (blockType === "stampeding-elephant.png") {
    elephantMsgTimer = currentTime + 3000;
    for (let i = 0; i < 3; i++) {
      const dxChoices = [-5, -4, 4, 5];
      const dyChoices = [-5, -4];
      extraBalls.push({
        rect: { x: blockRect.x + blockRect.w / 2 - ballSize / 2, y: blockRect.y + blockRect.h / 2 - ballSize / 2, w: ballSize, h: ballSize },
        dx: dxChoices[Math.floor(Math.random() * dxChoices.length)],
        dy: dyChoices[Math.floor(Math.random() * dyChoices.length)],
        trail: [],
        angle: 0
      });
    }
  } else {
    score += 50;
  }
}

function checkLevelClear(currentTime) {
  if (blocks.length === 0) {
    blocks = buildLevel();
    ballSize = 20;
    ball.w = ballSize;
    ball.h = ballSize;
    ballSurface = createBallCanvas(ballSize);
    tomatoTimer = 0;
    raccoonTimer = 0;
    bulldogTimer = 0;
    stegoTimer = 0;
    trexTimer = 0;
    triceratopsTimer = 0;
    pumpkinTimer = 0;
    dirtBlocks = [];
    extraBalls = [];
    ball.x = 390;
    ball.y = 300;
    ball.dy = -5;
    activeMissiles = [];
    rowsRemaining = 3;
    lastDropTime = currentTime;
  }
}

function rectsIntersect(r1, r2) {
  return !(r2.x > r1.x + r1.w || 
           r2.x + r2.w < r1.x || 
           r2.y > r1.y + r1.h ||
           r2.y + r2.h < r1.y);
}

// --- EVENT LISTENERS ---
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space") {
    e.preventDefault();
    if (gameState === "PLAYING") gameState = "PAUSED";
    else if (gameState === "PAUSED") gameState = "PLAYING";
  }
  if (e.code === "Digit1") {
    if (gameState === "PLAYING" && sharkMissiles > 0) {
      sharkMissiles--;
      activeMissiles.push({ x: paddle.x + paddle.w / 2 - 2, y: paddle.y - 15, w: 4, h: 15 });
      playBounceSound();
    }
  }
  if (e.code === "KeyF") {
    if (!document.fullscreenElement) {
      canvas.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
});

canvas.addEventListener("mousedown", e => {
  if (e.button === 0 && gameState === "GAME_OVER" && gameOverY >= 150) {
    if (mouseX >= 300 && mouseX <= 500 && mouseY >= 350 && mouseY <= 410) {
      lives = 3;
      score = 0;
      rowsRemaining = 3;
      blocks = buildLevel();
      ballSize = 20;
      ball.w = ballSize;
      ball.h = ballSize;
      ballSurface = createBallCanvas(ballSize);
      ball.x = 390;
      ball.y = 300;
      ball.dx = 5;
      ball.dy = -5;
      paddle.x = 350;
      ballTrail = [];
      walrusTimer = 0;
      tomatoTimer = 0;
      raccoonTimer = 0;
      bulldogTimer = 0;
      stegoTimer = 0;
      trexTimer = 0;
      triceratopsTimer = 0;
      pumpkinTimer = 0;
      sharkMissiles = 0;
      activeMissiles = [];
      dirtBlocks = [];
      extraBalls = [];
      Object.keys(iconAnimState).forEach(k => iconAnimState[k].wasActive = false);
      lastDropTime = performance.now();
      gameState = "PLAYING";
    }
  }
});

// --- MAIN LOOP ---
function update(currentTime) {
  // Grid Drop Event
  if (currentTime - lastDropTime >= dropInterval && gameState === "PLAYING") {
    lastDropTime = currentTime;
    if (rowsRemaining > 0) {
      blocks.forEach(b => {
        b.rect.y += (blockH + 5);
        if (b.rect.y + b.rect.h >= paddle.y) {
          gameState = "GAME_OVER";
          gameOverY = -120;
        }
      });

      if (gameState === "PLAYING") {
        for (let col = 0; col < 16; col++) {
          const rect = { x: col * (blockW + 5) + 24, y: 50, w: blockW, h: blockH };
          if (Math.random() < 0.15 && loadedCritters.length > 0) {
            let critter;
            const weights = loadedCritters.map(c => c.name === "basic-blueberry.png" ? 70 : 10);
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let rand = Math.random() * totalWeight;
            for (let i = 0; i < loadedCritters.length; i++) {
              if (rand < weights[i]) {
                critter = loadedCritters[i];
                break;
              }
              rand -= weights[i];
            }
            critter = critter || loadedCritters[0];
            blocks.push({ rect, image: critter.img, is_powerup: true, type: critter.name });
          } else {
            blocks.push({ rect, image: genericBlock, is_powerup: false, type: 'generic' });
          }
        }
        rowsRemaining--;
      }
    }
  }

  if (gameState === "PLAYING") {
    const currentSpeed = (keys["ShiftLeft"] || keys["ShiftRight"]) ? basePaddleSpeed * 2 : basePaddleSpeed;
    const controlsInverted = currentTime < raccoonTimer;
    const leftKey = controlsInverted ? keys["ArrowRight"] : keys["ArrowLeft"];
    const rightKey = controlsInverted ? keys["ArrowLeft"] : keys["ArrowRight"];

    if (leftKey) paddle.x -= currentSpeed;
    if (rightKey) paddle.x += currentSpeed;

    if (currentTime < triceratopsTimer) {
      paddle.x += triceratopsDrift;
    }

    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.w > 800) paddle.x = 800 - paddle.w;

    if (tomatoTimer > 0 && currentTime > tomatoTimer) {
      tomatoTimer = 0;
      ballSize = 20;
      const cx = ball.x + ball.w / 2;
      const cy = ball.y + ball.h / 2;
      ball.w = ballSize;
      ball.h = ballSize;
      ball.x = cx - ballSize / 2;
      ball.y = cy - ballSize / 2;
      extraBalls.forEach(e => {
        const ecx = e.rect.x + e.rect.w / 2;
        const ecy = e.rect.y + e.rect.h / 2;
        e.rect.w = ballSize;
        e.rect.h = ballSize;
        e.rect.x = ecx - ballSize / 2;
        e.rect.y = ecy - ballSize / 2;
      });
      ballSurface = createBallCanvas(ballSize);
    }

    if (bulldogTimer > 0 && currentTime > bulldogTimer) {
      bulldogTimer = 0;
      dirtBlocks = [];
    }

    // Paddle Hitbox Calculation
    const isWalrusActive = currentTime < walrusTimer;
    const isStegoActive = currentTime < stegoTimer;
    const paddleHitboxes = [];

    if (isWalrusActive) {
      paddleHitboxes.push({ x: paddle.x + paddle.w / 2 - 100, y: paddle.y - 10, w: 200, h: 30 });
    } else if (isStegoActive) {
      paddleHitboxes.push({ x: paddle.x, y: paddle.y, w: 16, h: 15 });
      paddleHitboxes.push({ x: paddle.x + paddle.w / 2 - 8, y: paddle.y, w: 16, h: 15 });
      paddleHitboxes.push({ x: paddle.x + paddle.w - 16, y: paddle.y, w: 16, h: 15 });
    } else {
      paddleHitboxes.push(paddle);
    }

    // Missile Physics
    activeMissiles = activeMissiles.filter(m => {
      m.y -= 12;
      if (m.y + m.h < 0) return false;

      for (let dirt of dirtBlocks) {
        if (rectsIntersect(m, dirt)) return false;
      }

      for (let i = 0; i < blocks.length; i++) {
        if (rectsIntersect(m, blocks[i].rect)) {
          const hit = blocks.splice(i, 1)[0];
          if (hit.is_powerup) {
            processPowerup(hit.type, currentTime, hit.rect);
          } else {
            score += 10;
          }
          checkLevelClear(currentTime);
          return false;
        }
      }
      return true;
    });

    // Main Ball Physics
    ballTrail.push({ x: ball.x + ball.w / 2, y: ball.y + ball.h / 2 });
    if (ballTrail.length > 6) ballTrail.shift();

    ball.x += ball.dx;
    ball.y += ball.dy;
    ball.angle -= 0.08;

    if (ball.x <= 0) {
      ball.x = 0;
      ball.dx *= -1;
      playBounceSound();
    } else if (ball.x + ball.w >= 800) {
      ball.x = 800 - ball.w;
      ball.dx *= -1;
      playBounceSound();
    }

    if (ball.y <= 0) {
      ball.y = 0;
      ball.dy *= -1;
      playBounceSound();
    }

    if (ball.y + ball.h >= 600) {
      if (extraBalls.length > 0) {
        const replacement = extraBalls.shift();
        ball.x = replacement.rect.x;
        ball.y = replacement.rect.y;
        ball.dx = replacement.dx;
        ball.dy = replacement.dy;
        ballTrail = replacement.trail;
        ball.angle = replacement.angle;
      } else {
        lives--;
        ballSize = 20;
        ball.w = ballSize;
        ball.h = ballSize;
        ballSurface = createBallCanvas(ballSize);
        ball.x = 390;
        ball.y = 300;
        ball.dy = -5;
        tomatoTimer = 0;
        raccoonTimer = 0;
        bulldogTimer = 0;
        stegoTimer = 0;
        trexTimer = 0;
        triceratopsTimer = 0;
        pumpkinTimer = 0;
        dirtBlocks = [];
        extraBalls = [];
        ballTrail = [];

        if (lives <= 0) {
          gameState = "GAME_OVER";
          gameOverY = -120;
        } else {
          lastDropTime = currentTime;
        }
      }
    }

    for (let hitBox of paddleHitboxes) {
      if (rectsIntersect(ball, hitBox) && ball.dy > 0) {
        const hitPos = ((ball.x + ball.w / 2) - (hitBox.x + hitBox.w / 2)) / (hitBox.w / 2);
        ball.dx = hitPos * 7;
        ball.dy *= -1;
        playBounceSound();

        if (currentTime < pumpkinTimer) {
          shakeTimer = currentTime + 300;
          let destroyed = 0;
          while (destroyed < 3 && blocks.length > 0) {
            const idx = Math.floor(Math.random() * blocks.length);
            const target = blocks.splice(idx, 1)[0];
            score += target.is_powerup ? 50 : 10;
            destroyed++;
          }
          checkLevelClear(currentTime);
        }
        break;
      }
    }

    for (let dirt of dirtBlocks) {
      if (rectsIntersect(ball, dirt)) {
        ball.dy *= -1;
        playBounceSound();
        break;
      }
    }

    for (let i = 0; i < blocks.length; i++) {
      if (rectsIntersect(ball, blocks[i].rect)) {
        ball.dy *= -1;
        playBounceSound();
        const hit = blocks.splice(i, 1)[0];
        if (hit.is_powerup) {
          processPowerup(hit.type, currentTime, hit.rect);
        } else {
          score += 10;
        }
        checkLevelClear(currentTime);
        break;
      }
    }

    // Extra Balls Physics
    extraBalls = extraBalls.filter(eBall => {
      eBall.trail.push({ x: eBall.rect.x + eBall.rect.w / 2, y: eBall.rect.y + eBall.rect.h / 2 });
      if (eBall.trail.length > 6) eBall.trail.shift();

      eBall.rect.x += eBall.dx;
      eBall.rect.y += eBall.dy;
      eBall.angle -= 0.08;

      if (eBall.rect.x <= 0) {
        eBall.rect.x = 0;
        eBall.dx *= -1;
        playBounceSound();
      } else if (eBall.rect.x + eBall.rect.w >= 800) {
        eBall.rect.x = 800 - eBall.rect.w;
        eBall.dx *= -1;
        playBounceSound();
      }

      if (eBall.rect.y <= 0) {
        eBall.rect.y = 0;
        eBall.dy *= -1;
        playBounceSound();
      }

      if (eBall.rect.y + eBall.rect.h >= 600) {
        return false;
      }

      for (let hitBox of paddleHitboxes) {
        if (rectsIntersect(eBall.rect, hitBox) && eBall.dy > 0) {
          const hitPos = ((eBall.rect.x + eBall.rect.w / 2) - (hitBox.x + hitBox.w / 2)) / (hitBox.w / 2);
          eBall.dx = hitPos * 7;
          eBall.dy *= -1;
          playBounceSound();

          if (currentTime < pumpkinTimer) {
            shakeTimer = currentTime + 300;
            let destroyed = 0;
            while (destroyed < 3 && blocks.length > 0) {
              const idx = Math.floor(Math.random() * blocks.length);
              const target = blocks.splice(idx, 1)[0];
              score += target.is_powerup ? 50 : 10;
              destroyed++;
            }
            checkLevelClear(currentTime);
          }
          break;
        }
      }

      for (let dirt of dirtBlocks) {
        if (rectsIntersect(eBall.rect, dirt)) {
          eBall.dy *= -1;
          playBounceSound();
          break;
        }
      }

      for (let i = 0; i < blocks.length; i++) {
        if (rectsIntersect(eBall.rect, blocks[i].rect)) {
          eBall.dy *= -1;
          playBounceSound();
          const hit = blocks.splice(i, 1)[0];
          if (hit.is_powerup) {
            processPowerup(hit.type, currentTime, hit.rect);
          } else {
            score += 10;
          }
          checkLevelClear(currentTime);
          break;
        }
      }
      return true;
    });
  }
}

// --- RENDER FUNCTION ---
function render(currentTime) {
  let shakeX = 0, shakeY = 0;
  if (currentTime < shakeTimer) {
    shakeX = Math.floor(Math.random() * 17) - 8;
    shakeY = Math.floor(Math.random() * 17) - 8;
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  ctx.fillStyle = "rgb(30, 30, 30)";
  ctx.fillRect(0, 0, 800, 600);

  if (gameState === "PLAYING" || gameState === "PAUSED") {
    // Paddle
    ctx.fillStyle = "rgb(200, 200, 200)";
    if (currentTime < stegoTimer) {
      ctx.fillRect(paddle.x, paddle.y, 16, 15);
      ctx.fillRect(paddle.x + paddle.w / 2 - 8, paddle.y, 16, 15);
      ctx.fillRect(paddle.x + paddle.w - 16, paddle.y, 16, 15);
    } else {
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    }

    // Walrus Shield
    if (currentTime < walrusTimer) {
      const pulse = (175 + 80 * Math.sin(currentTime / 100.0)) / 255;
      ctx.save();
      ctx.fillStyle = `rgba(0, 255, 255, ${pulse})`;
      ctx.beginPath();
      ctx.ellipse(paddle.x + paddle.w / 2, paddle.y - 10 + 15, 100, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Missiles
    ctx.fillStyle = "rgb(255, 100, 50)";
    activeMissiles.forEach(m => ctx.fillRect(m.x, m.y, m.w, m.h));

    // Blinking effect before drop
    const timeSinceDrop = currentTime - lastDropTime;
    const isBlinking = timeSinceDrop > 12000 && rowsRemaining > 0 && gameState === "PLAYING";
    const blinkAlpha = isBlinking ? Math.abs(Math.sin(currentTime / 100.0)) * 0.4 : 0;

    // Dirt Blocks
    dirtBlocks.forEach(d => ctx.drawImage(dirtSurface, d.x, d.y));

    // Blocks
    blocks.forEach(b => {
      ctx.drawImage(b.image, b.rect.x, b.rect.y);
      if (isBlinking) {
        ctx.fillStyle = `rgba(255, 255, 255, ${blinkAlpha})`;
        ctx.fillRect(b.rect.x, b.rect.y, b.rect.w, b.rect.h);
      }
    });

    // Main Ball Trail
    ballTrail.forEach((pos, i) => {
      const radius = (ballSize / 2) * (i / ballTrail.length);
      if (radius > 0) {
        ctx.fillStyle = "rgb(200, 50, 50)";
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Main Ball
    if (currentTime >= trexTimer) {
      ctx.save();
      ctx.translate(ball.x + ball.w / 2, ball.y + ball.h / 2);
      ctx.rotate(ball.angle);
      ctx.drawImage(ballSurface, -ball.w / 2, -ball.h / 2);
      ctx.restore();
    }

    // Extra Balls
    extraBalls.forEach(eBall => {
      eBall.trail.forEach((pos, i) => {
        const radius = (ballSize / 2) * (i / eBall.trail.length);
        if (radius > 0) {
          ctx.fillStyle = "rgb(200, 50, 50)";
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      if (currentTime >= trexTimer) {
        ctx.save();
        ctx.translate(eBall.rect.x + eBall.rect.w / 2, eBall.rect.y + eBall.rect.h / 2);
        ctx.rotate(eBall.angle);
        ctx.drawImage(ballSurface, -eBall.rect.w / 2, -eBall.rect.h / 2);
        ctx.restore();
      }
    });

    // UI Texts
    ctx.fillStyle = "rgb(255, 255, 255)";
    ctx.font = "bold 26px Arial";
    ctx.textAlign = "left";
    ctx.fillText(`Lives: ${lives}`, 20, 40);

    ctx.textAlign = "right";
    ctx.fillText(`Score: ${score}`, 780, 40);

    ctx.fillStyle = "rgb(200, 200, 255)";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.fillText(`New Rows Remaining: ${rowsRemaining}`, 400, 36);

    // Active Status Icons (HUD stack)
    const currentActive = [];
    if (currentTime < walrusTimer) currentActive.push('walrus');
    if (currentTime < tomatoTimer) currentActive.push('tomato');
    if (currentTime < raccoonTimer) currentActive.push('raccoon');
    if (currentTime < stegoTimer) currentActive.push('stego');
    if (currentTime < trexTimer) currentActive.push('trex');
    if (currentTime < triceratopsTimer) currentActive.push('triceratops');
    if (currentTime < pumpkinTimer) currentActive.push('pumpkin');
    if (sharkMissiles > 0) currentActive.push('shark');

    let iconX = 20;
    let iconY = 60;

    Object.keys(iconFilenames).forEach(key => {
      if (currentActive.includes(key)) {
        const state = iconAnimState[key];
        if (!state.wasActive) {
          state.offset = 40;
          state.angle = 0;
          state.wasActive = true;
        }

        if (state.offset > 0) {
          state.offset -= 4;
          if (state.offset < 0) state.offset = 0;
        } else if (state.angle > -0.174) {
          state.angle -= 0.035;
        }

        if (statusIcons[key]) {
          ctx.save();
          ctx.translate(iconX + 16, iconY + 16 + state.offset);
          ctx.rotate(state.angle);
          ctx.drawImage(statusIcons[key], -16, -16);
          ctx.restore();
        }

        if (key === 'shark') {
          ctx.fillStyle = "rgb(200, 200, 200)";
          ctx.font = "16px Arial";
          ctx.textAlign = "left";
          ctx.fillText(`[1] x ${sharkMissiles}`, iconX + 40, iconY + 22 + state.offset);
        }

        iconY += 36;
      } else {
        iconAnimState[key].wasActive = false;
      }
    });

    // Warning text overlays
    const warnings = [];
    if (currentTime < elephantMsgTimer) warnings.push({ text: "THE HERD! (MULTI-BALL)", color: "rgb(50, 255, 255)" });
    if (currentTime < pumpkinTimer) warnings.push({ text: "SEISMIC PADDLE!", color: "rgb(255, 140, 0)" });
    if (currentTime < raccoonTimer) warnings.push({ text: "CONTROLS INVERTED!", color: "rgb(255, 50, 50)" });
    if (currentTime < trexTimer) warnings.push({ text: "BALL CLOAKED!", color: "rgb(100, 255, 100)" });
    if (currentTime < triceratopsTimer) warnings.push({ text: "STAMPEDE DRIFT!", color: "rgb(255, 150, 0)" });

    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    warnings.forEach((warn, idx) => {
      ctx.fillStyle = warn.color;
      ctx.fillText(warn.text, 400, 90 + idx * 36);
    });

    // Control hint
    ctx.fillStyle = "rgb(150, 150, 150)";
    ctx.font = "16px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SHIFT: Sprint | SPACE: Pause | F: Fullscreen", 400, 580);

    // PAUSE MENU ENCYCLOPEDIA
    if (gameState === "PAUSED") {
      ctx.fillStyle = "rgba(15, 15, 25, 0.9)";
      ctx.fillRect(0, 0, 800, 600);

      const boxX = 70, boxY = 30, boxW = 660, boxH = 540;
      ctx.fillStyle = "rgb(25, 28, 42)";
      ctx.fillRect(boxX, boxY, boxW, boxH);

      ctx.strokeStyle = "rgb(100, 200, 255)";
      ctx.lineWidth = 3;
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.strokeStyle = "rgb(40, 90, 140)";
      ctx.lineWidth = 2;
      ctx.strokeRect(boxX + 4, boxY + 4, boxW - 8, boxH - 8);

      ctx.fillStyle = "rgb(255, 200, 0)";
      ctx.font = "bold 56px Impact";
      ctx.textAlign = "center";
      ctx.fillText("PAUSED", 400, 92);

      ctx.fillStyle = "rgb(180, 215, 255)";
      ctx.font = "18px Arial";
      ctx.fillText("STATUS EFFECTS & HAZARD GUIDE", 400, 126);

      const blockLeft = 140;
      let startY = 150;
      const rowSpacing = 42;

      ctx.font = "16px Arial";
      ctx.textAlign = "left";

      Object.keys(iconDescriptions).forEach(key => {
        if (statusIcons[key]) {
          ctx.drawImage(statusIcons[key], blockLeft, startY);
          ctx.fillStyle = "rgb(240, 240, 240)";
          ctx.fillText(iconDescriptions[key], blockLeft + 48, startY + 21);
        }
        startY += rowSpacing;
      });

      ctx.fillStyle = "rgb(100, 255, 100)";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Press SPACE to Resume Game", 400, 532);
    }
  } else if (gameState === "GAME_OVER") {
    if (gameOverY < 150) gameOverY += 5;

    ctx.fillStyle = "rgb(255, 50, 50)";
    ctx.font = "bold 88px Impact";
    ctx.textAlign = "center";
    ctx.fillText("YOU DIED", 400, gameOverY);

    if (gameOverY >= 150) {
      const isHover = (mouseX >= 300 && mouseX <= 500 && mouseY >= 350 && mouseY <= 410);
      ctx.fillStyle = isHover ? "rgb(150, 255, 150)" : "rgb(100, 200, 100)";
      ctx.fillRect(300, 350, 200, 60);

      ctx.fillStyle = "rgb(0, 0, 0)";
      ctx.font = "bold 28px Impact";
      ctx.fillText("NEW GAME", 400, 390);
    }
  }

  ctx.restore();
}

function gameLoop(time) {
  update(time);
  render(time);
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
